[project]
name = "elm-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Data generation + eval (runs on any platform incl. Mac)
    "anthropic>=0.96.0",
    "jsonschema>=4.23.0",
    "openai>=1.0.0",
    # Schema-constrained decoding (constrained.py). 1.x API: outlines.Generator
    "outlines>=1.3.3",
    "python-dotenv>=1.0.1",
    # Inference (infer_eval.py --no-adapter runs on Mac/MPS as well as CUDA)
    "accelerate>=1.13.0",
    "torch>=2.6",
    # Pulled in by unsloth. Must come from the same CUDA index as torch on
    # Linux — the PyPI build fails with "operator torchvision::nms does not
    # exist" and breaks the unsloth/peft imports.
    "torchvision>=0.21; sys_platform == 'linux'",
    "transformers>=5.5.0",
    # Training stack (Linux/CUDA only — Spark or bare-metal)
    "bitsandbytes>=0.49.2; sys_platform == 'linux'",
    "datasets>=4.1.1,<4.4.0; sys_platform == 'linux'",
    "peft>=0.19.1; sys_platform == 'linux'",
    "trl>=0.24.0; sys_platform == 'linux'",
    "unsloth>=2026.5.7; sys_platform == 'linux'",
]

[dependency-groups]
dev = []

[[tool.uv.index]]
  name = "pytorch-cu128"
  url = "https://download.pytorch.org/whl/cu128"
  explicit = true

  [tool.uv.sources]
  # cu128 wheel only applies on Linux (Spark / bare-metal training box)
  torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
  torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
